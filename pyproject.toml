[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stat-arb-engine"
version = "0.1.0"
description = "Statistical Arbitrage & Execution Research Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.3",
  "matplotlib==3.9.2",
  "scipy==1.14.1",
  "statsmodels==0.14.4",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",
  "ruff==0.6.9",
  "mypy==1.11.2",
]
live = [
  "requests==2.32.3",
  "python-dotenv==1.0.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
filterwarnings = [
  # Third-party: statsmodels coint() on near-colinear synthetic fixtures in research tests.
  "ignore:y0 and y1 are \\(almost\\) perfectly colinear:statsmodels.tools.sm_exceptions.CollinearityWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["results"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.isort]
# Legacy entry points in scripts/ import each other as top-level modules.
known-first-party = ["stat_arb_engine", "live_feed", "pair_finder"]

[tool.mypy]
python_version = "3.11"
files = [
  "src",
  "tests",
  "scripts/main.py",
  "scripts/pair_finder.py",
  "scripts/live_trading.py",
  "scripts/live_feed.py",
]
mypy_path = ["src", "scripts"]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
warn_unused_ignores = true
warn_redundant_casts = true
strict_optional = true
check_untyped_defs = true
no_implicit_optional = true
